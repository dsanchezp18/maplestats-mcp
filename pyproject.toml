[project]
name = "maple-data-mcp"
version = "0.1.0"
description = "One MCP server for Canadian public data — starting with Statistics Canada (WDS + RDaaS)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Daniel Sanchez" }]
keywords = ["mcp", "canada", "statcan", "government", "open-data", "ai", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=3.2.0",
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "pydantic>=2.0.0",
    "aiocache>=0.12.0",
    "tenacity>=8.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
maple-data-mcp = "maple_data_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maple_data_mcp"]
exclude = ["**/__tests__/**", "**/test_*.py", "**/conftest.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov",
    "ruff>=0.14.0",
    "pyright",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
