[project]
name = "maplestats-mcp"
version = "0.1.0"
description = "One MCP server for Canadian public data: Statistics Canada (tables, Census, PUMF microdata), the Bank of Canada, CMHC, federal agencies and provincial and municipal open-data portals, in English and French."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
requires-python = ">=3.12"
authors = [{ name = "Daniel Sánchez Pazmiño" }]
keywords = [
    "mcp",
    "canada",
    "statcan",
    "statistics",
    "census",
    "microdata",
    "government",
    "open-data",
    "ai",
    "llm",
    "bilingual",
    "francophone",
    "donnees-ouvertes",
    "gouvernement",
    "quebec",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Natural Language :: French",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    # The server relies on fastmcp 4 internals: the module loader
    # (server.ModuleProvider), the BM25 tokenizer hook (shared/search.py)
    # and middleware (shared/timeouts.py).
    "fastmcp>=4.0.3,<5",
    "httpx>=0.27.0",
    "h2>=4.1.0",
    "pydantic>=2.0.0",
    "cachetools>=5.3.0",
    "tenacity>=8.0.0",
    "defusedxml>=0.7.1",
    "uvicorn>=0.30.0",
    "tzdata>=2024.1",
    "beautifulsoup4>=4.15.0",
    "gtfs-realtime-bindings>=3.0.0",
    "openpyxl>=3.1.5",
    "duckdb>=1.5.5",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/dsanchezp18/maplestats-mcp"
Repository = "https://github.com/dsanchezp18/maplestats-mcp"
Issues = "https://github.com/dsanchezp18/maplestats-mcp/issues"
Changelog = "https://github.com/dsanchezp18/maplestats-mcp/commits/main"

[project.scripts]
maplestats-mcp = "maplestats_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maplestats_mcp"]
exclude = ["**/__tests__/**", "**/test_*.py", "**/conftest.py"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov",
    "ruff>=0.14.0",
    "pyright",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
