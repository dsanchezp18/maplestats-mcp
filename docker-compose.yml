services:
  mcp:
    build: .
    ports:
      - "${MAPLE_PORT:-8000}:${MAPLE_PORT:-8000}"
    environment:
      MAPLE_HOST: "0.0.0.0"
      MAPLE_PORT: "${MAPLE_PORT:-8000}"
      MAPLE_TRANSPORT: "${MAPLE_TRANSPORT:-http}"
      MAPLE_AUTH_TOKEN: "${MAPLE_AUTH_TOKEN:-}"
      MAPLE_REQUIRE_AUTH: "${MAPLE_REQUIRE_AUTH:-1}"
      MAPLE_MAX_CONCURRENT_REQUESTS: "${MAPLE_MAX_CONCURRENT_REQUESTS:-8}"
      MAPLE_RATE_LIMIT_REQUESTS: "${MAPLE_RATE_LIMIT_REQUESTS:-120}"
      MAPLE_RATE_LIMIT_WINDOW_SECONDS: "${MAPLE_RATE_LIMIT_WINDOW_SECONDS:-60}"
      # Only set to 1 when this container sits behind a reverse proxy that
      # itself sets X-Forwarded-For — trusting it directly would let any
      # caller spoof a different rate-limit bucket per request.
      MAPLE_TRUST_PROXY_HEADERS: "${MAPLE_TRUST_PROXY_HEADERS:-0}"
      MAPLE_CACHE_MAX_ENTRIES: "${MAPLE_CACHE_MAX_ENTRIES:-2000}"
      MAPLE_TOOL_TIMEOUT_SECONDS: "${MAPLE_TOOL_TIMEOUT_SECONDS:-120}"
      MAPLE_PUMF_CACHE_DIR: "/data/pumf"
      MAPLE_PUMF_CACHE_MAX_GB: "${MAPLE_PUMF_CACHE_MAX_GB:-5}"
      MAPLE_IP_HORIZONS_CACHE_DIR: "/data/ip_horizons"
      MAPLE_IP_HORIZONS_CACHE_MAX_GB: "${MAPLE_IP_HORIZONS_CACHE_MAX_GB:-3}"
      MAPLE_SSL_CERTFILE: "${MAPLE_SSL_CERTFILE:-}"
      MAPLE_SSL_KEYFILE: "${MAPLE_SSL_KEYFILE:-}"
    # Health check is defined in the Dockerfile (it picks http/https from
    # MAPLE_SSL_CERTFILE). The pumf and ip-horizons volumes keep downloaded
    # PUMF microdata and CIPO patent tables across restarts; everything
    # else is in memory.
    volumes:
      - pumf-cache:/data/pumf
      - ip-horizons-cache:/data/ip_horizons
    restart: unless-stopped

volumes:
  pumf-cache:
  ip-horizons-cache:
