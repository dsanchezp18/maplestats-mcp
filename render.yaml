services:
  - type: web
    name: maplestats-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render sends traffic to port 10000 by default.
      - key: MAPLE_PORT
        value: "10000"
      - key: MAPLE_HOST
        value: "0.0.0.0"
      - key: MAPLE_TRANSPORT
        value: http
      # Public endpoint: no token. The server only reads public open data;
      # the limits below (per client, from X-Forwarded-For) protect the free
      # instance and the upstream government APIs.
      - key: MAPLE_REQUIRE_AUTH
        value: "0"
      # Claude's connectors and the chat demo may reach this server from shared
      # addresses, so one bucket can serve many people: check Render's request
      # logs, and raise the limit (and the 60 a minute stated on the website's
      # connect, FAQ and privacy pages) if it does.
      - key: MAPLE_RATE_LIMIT_REQUESTS
        value: "60"
      # Slow file reads hold a slot for up to 2 minutes; 4 let a few of them
      # turn every other caller away with a 503.
      - key: MAPLE_MAX_CONCURRENT_REQUESTS
        value: "8"
      # Render's proxy sets X-Forwarded-For, so per-client rate limits work.
      - key: MAPLE_TRUST_PROXY_HEADERS
        value: "1"
      # The client address is read this many entries from the right of
      # X-Forwarded-For (what the caller writes sits on the left and can be
      # forged). Check it against a real request to /mcp if the limit ever
      # looks shared between callers.
      - key: MAPLE_TRUSTED_PROXY_HOPS
        value: "1"
      # Cloudflare fronts onrender.com and sets this header to the caller's own
      # address; the rightmost X-Forwarded-For entry may be a shared Cloudflare
      # or Render address that would put many callers in one bucket. If the
      # header does not arrive, the limiter falls back to X-Forwarded-For.
      - key: MAPLE_CLIENT_IP_HEADER
        value: CF-Connecting-IP
      # Counts calls and durations per tool name and day, and upstream errors
      # per host, in memory, public at /stats; no arguments or client
      # addresses are kept (shared/usage.py, shared/breaker.py).
      - key: MAPLE_USAGE_STATS
        value: "1"
      # The free instance has 512 MB: DuckDB spills to disk beyond this limit
      # (patent, open-database and microdata queries), and the patent cache
      # (the IPC table alone is 740 MB) is capped well under the free disk.
      - key: MAPLE_DUCKDB_MEMORY_LIMIT
        value: "256MB"
      - key: MAPLE_IP_HORIZONS_CACHE_MAX_GB
        value: "1.5"
      # PUMF tabulation downloads whole ZIPs; the free disk does not persist.
      - key: MAPLE_PUMF_TABULATE
        value: "0"
      # StatCan open-database (LODE) archives are unpacked to the system temp
      # folder (MAPLE_LODE_CACHE_DIR unset): the free plan has no persistent
      # disk, so they are downloaded again after each restart or deploy. On a
      # paid plan, attach a Render disk and point MAPLE_LODE_CACHE_DIR (and the
      # PUMF and IP Horizons cache directories) at it.
      # MAPLE_ALLOWED_ORIGINS is left unset: browser clients from the project
      # website and localhost may call /mcp; other browser origins get 403.
