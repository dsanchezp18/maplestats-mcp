services:
  - type: web
    name: maplestats-mcp
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      # Render sends traffic to port 10000 by default.
      - key: MAPLE_PORT
        value: "10000"
      - key: MAPLE_HOST
        value: "0.0.0.0"
      - key: MAPLE_TRANSPORT
        value: http
      # Public endpoint: no token. The server only reads public open data;
      # the limits below (per client, from X-Forwarded-For) protect the free
      # instance and the upstream government APIs.
      - key: MAPLE_REQUIRE_AUTH
        value: "0"
      - key: MAPLE_RATE_LIMIT_REQUESTS
        value: "60"
      - key: MAPLE_MAX_CONCURRENT_REQUESTS
        value: "4"
      # Render's proxy sets X-Forwarded-For, so per-client rate limits work.
      - key: MAPLE_TRUST_PROXY_HEADERS
        value: "1"
      # Counts calls per tool name and day, in memory, public at /stats; no
      # arguments or addresses are kept (shared/usage.py).
      - key: MAPLE_USAGE_STATS
        value: "1"
      # PUMF tabulation downloads whole ZIPs; the free disk does not persist.
      - key: MAPLE_PUMF_TABULATE
        value: "0"
