# Dependabot version updates. The workflows pin actions and the Dockerfile
# pins its base image by digest, so these entries are what keep those pins
# current. Python dependencies are locked in uv.lock (and chat/uv.lock);
# Dependabot's `uv` ecosystem updates pyproject.toml and the lockfile together.
#
# Monthly, and grouped: one entry covers both uv projects, so the server and
# the chat demo move in one pull request. Groups apply to version updates
# only unless they say otherwise, so security fixes get a group of their own;
# without it each advisory opened its own pull request (six in October 2026).
# Major versions stay ungrouped: each can break the server and needs review.
version: 2

updates:
  - package-ecosystem: uv
    directories:
      - /
      - /chat
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      python-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"

  # The server's and the chat demo's images share one base, so one grouped pull
  # request moves both digests together.
  - package-ecosystem: docker
    directories:
      - /
      - /chat
    schedule:
      interval: monthly
    groups:
      base-image:
        patterns:
          - "*"
