# Dependabot version updates. The workflows pin actions and the Dockerfile
# pins its base image by digest, so these entries are what keep those pins
# current. Python dependencies are locked in uv.lock; Dependabot's `uv`
# ecosystem updates pyproject.toml and the lockfile together.
version: 2

updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
