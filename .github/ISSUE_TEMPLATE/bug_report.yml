name: Bug report
description: A tool returned wrong data, an error, or nothing when it should have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Your AI client may have drafted and filed this for you (the server offers a template at `docs://report-issue`). Please remove personal identifiers, file paths and keys before submitting.
  - type: input
    id: tool
    attributes:
      label: Tool name
      description: The tool that misbehaved, e.g. statcan_get_data_from_vectors.
    validations:
      required: true
  - type: textarea
    id: call
    attributes:
      label: Arguments and result
      description: The arguments you passed and what came back (error text or a snippet of the response).
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
  - type: textarea
    id: evidence
    attributes:
      label: Why it looks wrong
      description: Anything that shows the problem, such as the source's own figure, a null field, or a provenance as-of date that disagrees with the source.
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `uvx maplestats-mcp --version`, or the commit if running from source.
