name: Live smoke tests

# Mocked unit tests cannot see upstream API changes, so the live smoke
# scripts run on a schedule instead. Deliberately not on push or
# pull_request: an upstream outage must never block a merge.
on:
  schedule:
    # Mondays 06:17 UTC; an off-the-hour minute avoids the :00 queue spike.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-smoke
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.list.outputs.scripts }}
    steps:
      - uses: actions/checkout@v4
      # Same glob as scripts/verify.ps1, so a new smoke_test_*.py is picked
      # up without editing this file. stress_test.py does not match: it is a
      # transport load test, not an upstream check.
      - id: list
        run: |
          scripts=$(ls scripts/smoke_test*.py | xargs -n1 basename | sed 's/\.py$//' | jq -R . | jq -s -c .)
          echo "scripts=$scripts" >> "$GITHUB_OUTPUT"
          echo "$scripts"

  smoke:
    needs: discover
    runs-on: ubuntu-latest
    # smoke_test_modules.py chains many live calls with retries; the rest
    # finish in a minute or two.
    timeout-minutes: 25
    strategy:
      # One broken upstream must not cancel or hide the others.
      fail-fast: false
      # Keep the load on shared government hosts (several StatCan scripts) polite.
      max-parallel: 8
      matrix:
        script: ${{ fromJSON(needs.discover.outputs.scripts) }}
    name: ${{ matrix.script }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Run ${{ matrix.script }}
        run: uv run python "scripts/${{ matrix.script }}.py" 2>&1 | tee smoke.log
        shell: bash -o pipefail {0}
      - name: Summarize failure
        if: failure()
        run: |
          {
            echo "### FAIL: \`${{ matrix.script }}\`"
            echo '```'
            tail -n 40 smoke.log 2>/dev/null || echo "(no log captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Opens one issue per breakage instead of relying on GitHub's default
  # email, which only reaches whoever last edited the cron line. Later
  # failing runs comment on the open issue rather than opening new ones.
  alert:
    needs: smoke
    if: ${{ always() && needs.smoke.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Open or update the smoke-failure issue
        run: |
          # Failed matrix jobs are named after their script.
          failed=$(gh api --paginate "repos/$GH_REPO/actions/runs/${{ github.run_id }}/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure") | .name' | sort -u)
          body=$(printf 'Live smoke run failed: %s\n\nFailing scripts:\n%s\n\nEach job summary shows the last 40 log lines.\n' \
            "$RUN_URL" "$(echo "$failed" | sed 's/^/- `/; s/$/`/')")
          gh label create smoke-failure --color B60205 \
            --description "Scheduled live smoke test found a broken upstream" 2>/dev/null || true
          issue=$(gh issue list --label smoke-failure --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --body "$body"
          else
            gh issue create --label smoke-failure \
              --title "Live smoke tests failing ($(date -u +%Y-%m-%d))" --body "$body"
          fi
