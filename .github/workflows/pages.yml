name: Website

# Builds the website from site/ and the server's own tool registry
# (scripts/build_site.py) and publishes it to GitHub Pages. Needs Pages
# enabled once with Settings > Pages > Source: GitHub Actions.
#
# It runs after the CI workflow (ci.yml, name: CI) finishes a push to main,
# and only if CI passed, so a commit that fails lint, types or the tests in
# tests/test_site.py is never published. It builds the exact commit CI
# tested (head_sha), not whatever main points to by then. workflow_run has
# no path filter, so every green push to main rebuilds the site: a change to
# scripts/site_charts.py, pyproject.toml or uv.lock is published as surely as
# one to site/. workflow_dispatch rebuilds the current main by hand.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # A pull request whose head branch is also called main triggers
    # workflow_run too; only CI runs for pushes to this repository count.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python scripts/build_site.py --out build/site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: build/site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write  # Pages deployment authenticates with GitHub OIDC
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
