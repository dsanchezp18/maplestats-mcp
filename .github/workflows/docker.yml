name: Docker images

# Render deploys backup copies of the server and the chat demo straight from these Dockerfiles
# (render.yaml and chat/render.yaml), and deploy-azure below rolls the server
# image out to Azure (deploy-chat-azure the chat image), so a base-image bump or a dependency without a wheel for the
# image's Python must fail here, not on the next deploy. ci.yml's test matrix
# runs uv's own Python, not the image. Kept out of ci.yml so a registry outage
# cannot hold back the website, which publishes only after CI passes.
#
# Images are pushed and deployed only after CI passes on a push to main
# (workflow_run, as pages.yml), from the exact commit CI tested (head_sha).
# Before 2026-11, this ran on push alongside CI, so a commit that failed the
# tests still became :latest and the public server. Pull requests and manual
# runs build and check the image without pushing it.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    # A pull request whose head branch is also called main triggers
    # workflow_run too; only CI runs for pushes to this repository count.
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The Azure Container Apps instance pulls the server image from GitHub's
    # registry (ghcr.io), which is free for a public package; Azure's own
    # registry cost about $5 a month.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Under workflow_run, GITHUB_SHA is main's tip, not the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: >-
          docker build -t maplestats-mcp
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          .
      - name: The image starts and answers /health
        run: |
          docker run -d --name mcp -p 8000:8000 -e MAPLE_REQUIRE_AUTH=0 maplestats-mcp
          for _ in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health; then exit 0; fi
            sleep 2
          done
          docker logs mcp
          exit 1
      # Only main is published, after CI and /health passed; pull requests
      # build and test the image without pushing it.
      - name: Push to ghcr.io
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short_sha="${HEAD_SHA::7}"
          docker tag maplestats-mcp "$IMAGE:$short_sha"
          docker tag maplestats-mcp "$IMAGE:latest"
          docker push "$IMAGE:$short_sha"
          docker push "$IMAGE:latest"

  chat:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The chat's Azure container app pulls this image from ghcr.io too.
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/maplestats-chat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Under workflow_run, GITHUB_SHA is main's tip, not the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - run: >-
          docker build -t maplestats-chat
          --label org.opencontainers.image.source=https://github.com/${{ github.repository }}
          -f chat/Dockerfile chat
      # Building is not enough: an image that misses a module (results.py, 2026-11-02)
      # builds fine and fails only when Render starts it.
      - name: The image starts and answers /health
        run: |
          docker run -d --name chat -p 10000:10000 maplestats-chat
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:10000/health; then exit 0; fi
            sleep 2
          done
          docker logs chat
          exit 1
      - name: Push to ghcr.io
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          short_sha="${HEAD_SHA::7}"
          docker tag maplestats-chat "$IMAGE:$short_sha"
          docker tag maplestats-chat "$IMAGE:latest"
          docker push "$IMAGE:$short_sha"
          docker push "$IMAGE:latest"

  # Rolls the image pushed above out to the Azure Container Apps instance. It
  # signs in with GitHub's OIDC token, so no Azure secret is stored: the
  # repository variables AZURE_CLIENT_ID, AZURE_TENANT_ID and
  # AZURE_SUBSCRIPTION_ID name a deploy identity whose federated credential
  # trusts this repository's main branch, with Contributor on the container app
  # only and Reader on its resource group. Skipped until those variables exist.
  deploy-azure:
    needs: server
    if: github.event_name == 'workflow_run' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    # One rollout at a time; a newer push waits for the current one to finish.
    concurrency:
      group: deploy-azure
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RESOURCE_GROUP: maplestats-rg
      APP: maplestats-mcp
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Sign in to Azure with GitHub's OIDC token
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
      # The image requires a token by default; the public endpoint opts out,
      # as render.yaml does. The /stats counts are kept on the app's Azure Files
      # share at /data, so a deploy no longer starts them from zero.
      - name: Deploy the image
        run: |
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --image "$IMAGE:${HEAD_SHA::7}" \
            --set-env-vars MAPLE_REQUIRE_AUTH=0 MAPLE_USAGE_STATS_FILE=/data/usage/stats.json \
            --only-show-errors --output none
      # The app keeps serving the previous revision until the new one passes
      # its probes, so a bad image fails this step without taking the server down.
      - name: The new revision is healthy and answers MCP
        run: |
          revision=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" \
            --query properties.latestRevisionName -o tsv --only-show-errors)
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          for _ in $(seq 1 40); do
            health=$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP" \
              --revision "$revision" --query properties.healthState -o tsv --only-show-errors)
            echo "$revision: $health"
            [ "$health" = Healthy ] && break
            [ "$health" = Unhealthy ] && exit 1
            sleep 15
          done
          [ "$health" = Healthy ] || exit 1
          curl -fsS --max-time 60 "https://$fqdn/health"
          curl -fsS --max-time 60 -o /dev/null -H "Content-Type: application/json" \
            -H "Accept: application/json, text/event-stream" "https://$fqdn/mcp" \
            -d '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-03-26","capabilities":{},"clientInfo":{"name":"deploy-check","version":"1"}}}'

  # Rolls the chat image out to its own Azure container app, in the same
  # environment as the server, with the same deploy identity (which also holds
  # Contributor on maplestats-chat). The model key lives in the app's secrets,
  # never here.
  deploy-chat-azure:
    needs: chat
    if: github.event_name == 'workflow_run' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: deploy-chat-azure
      cancel-in-progress: false
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      RESOURCE_GROUP: maplestats-rg
      APP: maplestats-chat
      SERVER_APP: maplestats-mcp
      IMAGE: ghcr.io/${{ github.repository_owner }}/maplestats-chat
    steps:
      - name: Sign in to Azure with GitHub's OIDC token
        run: |
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --output none
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          az config set extension.use_dynamic_install=yes_without_prompt --only-show-errors
      # The chat's /stats counts (chat/usage.py) are kept on the Azure Files
      # storage the server already mounts at /data, so a deploy does not reset
      # them. The chat mounts only the share's chat/ folder (subPath), at
      # /data/chat: it faces the public and holds the model key, so it must not
      # read or write the server's files. The first run adds the volume with a
      # PATCH of the template only (az containerapp update --yaml would resend
      # the secrets without their values); later runs find it mounted and change nothing. If the identity
      # may not attach the storage, the deploy goes on and the counts stay in
      # memory, as before.
      - name: Mount the shared file storage for the usage counts
        id: storage
        continue-on-error: true
        run: |
          storage=$(az containerapp show -g "$RESOURCE_GROUP" -n "$SERVER_APP" --only-show-errors \
            --query "properties.template.volumes[?storageType=='AzureFile'] | [0].storageName" -o tsv)
          if [ -z "$storage" ]; then
            echo "::warning::$SERVER_APP mounts no Azure Files storage; the chat's counts stay in memory."
            exit 0
          fi
          # Read and PATCH with the same API version: the CLI's own version can
          # return fields an older one refuses (cooldownPeriod, pollingInterval).
          api=2025-07-01
          app_id=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --only-show-errors \
            --query id -o tsv)
          az rest --method get --only-show-errors \
            --url "https://management.azure.com$app_id?api-version=$api" > app.json
          mounted=$(jq '[.properties.template.containers[0].volumeMounts // [] | .[]
            | select(.mountPath == "/data/chat")] | length' app.json)
          if [ "$mounted" = 0 ]; then
            jq --arg storage "$storage" '{properties: {template: (.properties.template
              | del(.revisionSuffix)
              | .volumes = ((.volumes // []) + [{name: "shared-data", storageType: "AzureFile", storageName: $storage}])
              | .containers[0].volumeMounts = ((.containers[0].volumeMounts // []) + [{volumeName: "shared-data", mountPath: "/data/chat", subPath: "chat"}]))}}' \
              app.json > patch.json
            az rest --method patch --only-show-errors --output none --body @patch.json \
              --url "https://management.azure.com$app_id?api-version=$api"
            # The PATCH returns before the new revision exists; the image update
            # below would be refused while it is still provisioning.
            for _ in $(seq 1 40); do
              state=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" --only-show-errors \
                --query properties.provisioningState -o tsv)
              echo "provisioning: $state"
              [ "$state" = Succeeded ] && break
              [ "$state" = Failed ] && exit 1
              sleep 15
            done
            [ "$state" = Succeeded ] || exit 1
          fi
          echo "mounted=yes" >> "$GITHUB_OUTPUT"
      # The app was created with a placeholder image on port 80; the chat image
      # listens on 10000. Setting the port again is a no-op after the first run.
      - name: Deploy the image
        env:
          MOUNTED: ${{ steps.storage.outputs.mounted }}
        run: |
          az containerapp ingress update --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --target-port 10000 --only-show-errors --output none
          extra=()
          if [ "$MOUNTED" = yes ]; then
            extra=(--set-env-vars CHAT_USAGE_STATS_FILE=/data/chat/stats.json)
          fi
          az containerapp update --resource-group "$RESOURCE_GROUP" --name "$APP" \
            --image "$IMAGE:${HEAD_SHA::7}" "${extra[@]}" --only-show-errors --output none
      # The previous revision keeps serving until the new one passes its probes.
      - name: The new revision is healthy and serves the page
        run: |
          revision=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" \
            --query properties.latestRevisionName -o tsv --only-show-errors)
          fqdn=$(az containerapp show -g "$RESOURCE_GROUP" -n "$APP" \
            --query properties.configuration.ingress.fqdn -o tsv --only-show-errors)
          for _ in $(seq 1 40); do
            health=$(az containerapp revision show -g "$RESOURCE_GROUP" -n "$APP" \
              --revision "$revision" --query properties.healthState -o tsv --only-show-errors)
            echo "$revision: $health"
            [ "$health" = Healthy ] && break
            [ "$health" = Unhealthy ] && exit 1
            sleep 15
          done
          [ "$health" = Healthy ] || exit 1
          curl -fsS --max-time 60 "https://$fqdn/health"
          curl -fsS --max-time 60 -o /dev/null "https://$fqdn/"
          # Shows whether the counts are kept on the file share ("persisted": true).
          curl -fsS --max-time 60 "https://$fqdn/stats" | jq -c '{persisted, counting_since, questions}'

