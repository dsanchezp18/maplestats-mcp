name: Release

# Push a tag like v0.1.0 whose version matches pyproject.toml and server.json
# (tests/test_release.py checks that they agree). Publishes to PyPI, then the
# MCP Registry and Smithery; Smithery needs the SMITHERY_API_KEY secret.

on:
  push:
    tags: ["v*"]

# Jobs that need more (publishing, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # Same gate as ci.yml, so a tag on a commit that failed CI cannot publish.
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Tag matches the package version
        run: test "${GITHUB_REF_NAME#v}" = "$(uv run python -c 'import maplestats_mcp; print(maplestats_mcp.__version__)')"
      - run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  mcp-registry:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned and checksummed: this job holds an OIDC token, so an unverified
      # "latest" binary could publish anything under our name. To bump, set
      # both values from the release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # From registry_1.8.1_checksums.txt, checked against the downloaded file.
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # PyPI can take a minute to serve a new release's README, which the
      # registry reads to verify ownership (the mcp-name comment).
      - run: sleep 60
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  smithery:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: "3.12"
      - run: uv sync --locked
      # The bundle launches the PyPI release with uvx, so it must follow the
      # pypi job; it carries the tool list read from this commit's server.
      - run: uv run python scripts/build_smithery_bundle.py dist
      # Pinned, like mcp-publisher above: this step holds the Smithery key.
      # SMITHERY_API_KEY is a repository secret from smithery.ai account settings.
      - name: Publish to Smithery
        env:
          SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
        run: |
          test -n "$SMITHERY_API_KEY" || { echo "::error::SMITHERY_API_KEY secret is not set"; exit 1; }
          npx -y @smithery/cli@4.11.1 mcp publish "dist/maplestats-mcp-${GITHUB_REF_NAME#v}.mcpb" -n dsanchezp998/maplestats-mcp

  github-release:
    # The tag's GitHub Release, with notes GitHub writes from the pull
    # requests merged since the previous tag, and the built wheel and sdist
    # attached. pyproject.toml's Changelog link and the site's version line
    # point at these releases.
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME"
          --generate-notes
          --verify-tag
