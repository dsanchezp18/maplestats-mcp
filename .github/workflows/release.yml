name: Release

# Push a tag like v0.1.0 whose version matches pyproject.toml and server.json
# (tests/test_release.py checks that they agree). Publishes to PyPI, then the
# MCP Registry and a GitHub Release. Or run it by hand on main with the
# version (no "v"): it checks the version, creates the tag on that commit,
# then publishes the same way.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to tag and publish, e.g. 0.4.3"
        required: true
        type: string

env:
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

# Jobs that need more (publishing, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          version: "0.11.7" # same uv as both Dockerfiles; bump all three together
      - name: A run by hand publishes main only
        if: github.event_name == 'workflow_dispatch'
        run: test "$GITHUB_REF" = refs/heads/main
      - run: uv sync --locked
      # Same gate as ci.yml, so a tag on a commit that failed CI cannot publish.
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      - run: uv run pytest -q
      - name: Tag matches the package version
        run: test "${TAG#v}" = "$(uv run python -c 'import maplestats_mcp; print(maplestats_mcp.__version__)')"
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dist
          path: dist/

  tag:
    # Only on a run by hand: create the tag on the commit just built and
    # tested. Fails if the tag already exists.
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api "repos/$GITHUB_REPOSITORY/git/refs"
          -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

  pypi:
    needs: [build, tag]
    # tag is skipped on a tag push; a failed tag stops the publish.
    if: ${{ !cancelled() && needs.build.result == 'success' && needs.tag.result != 'failure' }}
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing: no token stored in the repo
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1

  mcp-registry:
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # GitHub OIDC login to the MCP Registry
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Pinned and checksummed: this job holds an OIDC token, so an unverified
      # "latest" binary could publish anything under our name. To bump, set
      # both values from the release's registry_<version>_checksums.txt.
      - name: Install mcp-publisher
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          # From registry_1.8.1_checksums.txt, checked against the downloaded file.
          MCP_PUBLISHER_SHA256: "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc"
        run: |
          curl -fsSL -o mcp-publisher.tar.gz "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher.tar.gz mcp-publisher
      # PyPI can take a minute to serve a new release's README, which the
      # registry reads to verify ownership (the mcp-name comment).
      - run: sleep 60
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish

  github-release:
    # The tag's GitHub Release, with notes GitHub writes from the pull
    # requests merged since the previous tag, and the built wheel and sdist
    # attached. pyproject.toml's Changelog link and the site's version line
    # point at these releases.
    needs: pypi
    if: ${{ !cancelled() && needs.pypi.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: dist
          path: dist/
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$TAG" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "$TAG"
          --generate-notes
          --verify-tag
