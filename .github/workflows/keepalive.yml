name: keepalive

# Render's free web service spins down after about 15 minutes idle, and a cold
# start (50 s or more) looks like a broken server to MCP clients. GitHub's
# schedule can lag by several minutes, so this reduces sleeps rather than
# removing them.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: curl --fail --silent --show-error --max-time 90 https://maplestats-mcp.onrender.com/health
