name: CI

on:
  push:
    branches: [main]
  pull_request:

# Jobs that need more (publishing, releases) ask for it themselves.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pyright
      # pytest-xdist, one worker per core (4 on a standard runner). loadfile
      # keeps each test file on one worker, so a module-scoped fixture (the
      # built website, one search session for the discovery queries) is set
      # up once rather than once per worker.
      - run: uv run pytest -q -n auto --dist loadfile
