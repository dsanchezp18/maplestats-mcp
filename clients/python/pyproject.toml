[project]
name = "maplestats"
version = "0.1.0"
description = "Python client for the hosted MapleStats MCP server (Canadian open data)"
readme = "README.md"
license = "MIT"
authors = [{ name = "Daniel Sanchez Pazmino" }]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "polars>=1.0",
]

[project.urls]
Homepage = "https://maplestats.danielstats.io/"
Repository = "https://github.com/dsanchezp18/maplestats-mcp"

[dependency-groups]
dev = [
    "pyright>=1.1.380",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/maplestats"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "standard"
include = ["src", "tests"]
venvPath = "."
venv = ".venv"
