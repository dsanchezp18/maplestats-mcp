services:
  # Chat demo (chat/): holds the model API key and calls the public MCP
  # server (render.yaml at the repo root).
  # Set CHAT_API_KEY in the Render dashboard; never commit it. It runs in its
  # own Render workspace, apart from the MCP server, so the two do not share
  # one pool of free instance hours. Use this file as that workspace's
  # Blueprint path.
  - type: web
    name: maplestats-chat
    runtime: docker
    dockerfilePath: ./chat/Dockerfile
    dockerContext: ./chat
    plan: free
    healthCheckPath: /health
    envVars:
      - key: CHAT_PROVIDER
        value: anthropic
      - key: CHAT_MODEL
        value: claude-haiku-5-5
      - key: CHAT_API_KEY
        sync: false
      - key: CHAT_RATE_PER_HOUR
        value: "20"
      - key: CHAT_DAILY_LIMIT
        value: "500"
