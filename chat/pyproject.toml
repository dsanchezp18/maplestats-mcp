[project]
name = "maplestats-chat"
version = "0.1.0"
description = "Small chat demo that lets a cheap LLM use the MapleStats MCP server."
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.60.0",
    "fastmcp>=4.0.3,<5",
    "openai>=1.60.0",
    "starlette>=0.40",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.ruff]
line-length = 88

[tool.pytest.ini_options]
pythonpath = ["."]
